aid: adentro
name: Adentro
description: >-
  Adentro (formerly Zenreach) is a WiFi marketing and customer-intelligence
  platform that connects online marketing spend to real-world, in-store visits
  for brick-and-mortar businesses. Branded guest-WiFi portals capture and enrich
  first-party customer profiles, measure foot traffic and a "Walk-Through Rate"
  attribution metric, and power automated email and audience-targeting campaigns
  across roughly 100 million verified US consumer profiles. Adentro serves
  retail, food and beverage, venues and arenas, and entertainment and hospitality
  brands. It exposes a partner/customer-gated Contacts API and a Location &
  Scanning API (V2/V3) for syncing captured contacts, visits, and location data
  into CRMs and loyalty platforms such as Fishbowl and Alpine IQ; access is
  granted via an Adentro-issued token passed in the Authorization header rather
  than through a public self-serve developer portal.
